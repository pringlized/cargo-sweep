[package]
name = "cargo-sweep"
version = "0.1.0"
edition = "2024"
description = "Clean stale Rust build caches across a dev machine, without touching release/ or anything a live process runs from"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
walkdir = "2.5.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
